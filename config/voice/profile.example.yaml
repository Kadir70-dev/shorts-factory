identity: k70_host_v1
display_name: "K70 host voice"
locked: true

prosody:
  speed: 1.04
  sentence_pause_ms: 180
  paragraph_pause_ms: 320

# Strict local cascade. Each engine uses this same recorded speaker; there are no
# cloud APIs and no built-in/stock voices.
engines:
  chatterbox:
    enabled: true
    reference_wav: "data/voice/k70_host_v1/reference/ref_01.wav"
    settings:
      python_bin: ".venv-voice/bin/python"
      device: cuda
      exaggeration: 0.4
      cfg_weight: 0.5

  openf5:
    enabled: true
    # This exact repository is enforced because its weights are Apache-2.0.
    # The ordinary SWivid F5 checkpoints are CC-BY-NC and are rejected.
    repository: "mrfakename/OpenF5-TTS-Base"
    model_path: "data/models/openf5/model.pt"
    config_path: "data/models/openf5/config.yaml"
    vocab_path: "data/models/openf5/vocab.txt"
    reference_wav: "data/voice/k70_host_v1/reference/ref_01.wav"
    reference_text: "Replace this with the exact transcript of ref_01.wav."
    settings:
      python_bin: ".venv-voice/bin/python"
      nfe_step: 32

  # CPU-only last resort: this must be the model fine-tuned on your recordings.
  piper:
    enabled: true
    model_path: "data/models/piper/k70_host/k70_host.onnx"
    settings:
      noise_scale: 0.667
      noise_w: 0.8
      sentence_silence: 0.25

# Optional per-channel additions. The larger shared dictionary lives in
# pronunciation.yaml and is applied before every engine.
pronunciation:
  lexicon: {}
  say_as: {}
