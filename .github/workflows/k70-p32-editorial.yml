name: K70 P3.2 Editorial Repair

on:
  push:
    branches: [main]
    paths:
      - "tools/k70_scene_engine/p32_editorial.py"
      - "tools/k70_scene_engine/editorial_plates.py"
      - "tools/k70_scene_engine/explainer_graphics.py"
      - "scripts/k70_p32_editorial_repair.py"
      - "scripts/k70_p34_threejs_final.py"
      - "tests/test_k70_p34_threejs_final.py"
      - "tests/test_k70_p32_editorial.py"
      - ".github/workflows/k70-p32-editorial.yml"
  pull_request:
    paths:
      - "tools/k70_scene_engine/p32_editorial.py"
      - "tools/k70_scene_engine/editorial_plates.py"
      - "tools/k70_scene_engine/explainer_graphics.py"
      - "scripts/k70_p32_editorial_repair.py"
      - "scripts/k70_p34_threejs_final.py"
      - "tests/test_k70_p34_threejs_final.py"
      - "tests/test_k70_p32_editorial.py"
      - ".github/workflows/k70-p32-editorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p32-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Compile P3.2 CLI
        run: python -m py_compile scripts/k70_p32_editorial_repair.py scripts/k70_p34_threejs_final.py
      - name: Run P3.2 editorial tests (offline, no render)
        run: python -m pytest -q tests/test_k70_p32_editorial.py tests/test_k70_p34_threejs_final.py tests/test_k70_p3_intelligent_editor.py
