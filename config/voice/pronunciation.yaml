# ─────────────────────────────────────────────────────────────────────────────
# PRONUNCIATION DICTIONARY
#
# Applied to a COPY of the narration immediately before synthesis. The written
# form is never touched, so the screen still shows "NVDA" and "$4.2B" while the
# voice says "en-vidia" and "four point two billion dollars".
#
# Why this file exists: neural TTS engines guess at proper nouns, and they guess
# DIFFERENTLY from each other. Without a dictionary the same script is read one
# way by Chatterbox and another by F5 — which is the opposite of a consistent
# narrator. Fixing it here rather than per-engine is what keeps the voice stable
# no matter which engine rendered a given short.
#
# ── Ordering ────────────────────────────────────────────────────────────────
# Sections apply in this order, longest-match-first WITHIN each section:
#   1. phrases    multi-word, most specific
#   2. companies  brand and company names
#   3. people     executives, officials, analysts
#   4. tickers    $AAPL / NASDAQ:AAPL / bare AAPL when whitelisted
#   5. terms      finance vocabulary and abbreviations
#   6. letters    acronyms spoken letter-by-letter
# A term matched by an earlier section is never re-matched by a later one.
#
# ── Writing replacements ────────────────────────────────────────────────────
# Write what the voice should SAY, using ordinary spelling. Hyphens mark
# syllable stress hints for the engines that honour them; they are harmless
# elsewhere. Do NOT use IPA — none of these engines accept it directly.
#   good:  "en-vidia"  "eye-triple-e"  "ee-bit-dah"
#   bad:   "ɛnˈvɪdiə"
# ─────────────────────────────────────────────────────────────────────────────
version: 1

# Bare uppercase tokens are only treated as tickers if listed here. Without a
# whitelist, "CEO", "GDP" and "USA" all get read as stock symbols.
ticker_whitelist:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - GOOG
  - META
  - TSLA
  - BRKB
  - JPM
  - V
  - WMT
  - COST
  - XOM
  - UNH
  - JNJ
  - PG
  - HD
  - KO
  - PEP
  - DIS
  - NFLX
  - AMD
  - INTC
  - CRM
  - ORCL
  - BA
  - GE
  - F
  - GM

