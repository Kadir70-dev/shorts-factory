# ───────────────────────────────────────────────────────────────────────────
# PRODUCTION PRESET · educational explainer  (v1-production, frozen)
# Clear, curiosity-driven "why/how" explainers. Hook with the surprise, then build
# understanding. Point-to-point grounding: real footage + on-screen stats/diagrams,
# with ONE cinematic AI hero still for the key concept. CPU-safe, ≤2 AI stills.
# Run:  .venv/bin/python scripts/produce.py --preset educational --topic "..."
# ───────────────────────────────────────────────────────────────────────────
name: educational
channel_id: k70_facts
niche: usa_facts

env:
  RENDER_BACKEND: ffmpeg
  VISUAL_ACCURACY_MODE: strict
  LAYERED_RENDER: "1"
  CHARACTER_MEMORY: "1"
  QA_ENABLED: "1"
  AI_VIDEO_ENABLED: "0"
  ENABLE_IMAGE_TO_VIDEO: "0"
  COMFYUI_ENABLED: "0"
  LAYERED_AI_STILL_BUDGET: "2"
  LAYERED_MAX_HERO_SCENES: "1"
  LAYERED_FFMPEG_THREADS: "4"
  LAYERED_SUBJECT_MATTE: oval
  LAYERED_MIN_FREE_MB: "2000"

  # ── Six-channel visual mix ───────────────────────────────────────────────
  STORYBOARD_ENGINE_ENABLED: "1"
  MULTI_SOURCE_ASSET_ENGINE_ENABLED: "1"
  MOTION_GRAPHICS_ENGINE_ENABLED: "1"
  THREEJS_VISUAL_ENGINE_ENABLED: "1"
  AI_BROLL_ENGINE_ENABLED: "1"

  # Three.js renders at PREVIEW resolution (360x640, upscaled by the renderer)
  # rather than 1080x1920. This is a memory ceiling, not a speed preference, and
  # raising the timeout does not help. Measured on a 4-core / 3.7 GB WSL box:
  #
  #   360x640    30 frames   13.2s   440 ms/frame   1395 MB RSS
  #   1080x1920  30 frames   17.6s   588 ms/frame   2049 MB RSS
  #   1080x1920 186 frames   >900s  (thrashing — 588 ms/frame predicts ~109s)
  #
  # The browser alone reaches 2 GB at full resolution, against 3.7 GB total, so a
  # full-length beat swaps rather than renders. Set this to `final` on a host with
  # 8 GB+ free; the pipeline reads it per render and nothing else changes.
  THREEJS_QUALITY: preview

# Explainers are concept-led, not character-led.
character:
  name: ""
  desc: ""
  style: ""

story:
  pacing: "surprising hook → one clear idea → satisfying payoff"
  hook_style: "It's not what you think."
  hero_beat: "the single concept made visual (the mechanism, the comparison, the reveal)"
  visual_doctrine: >
    Every beat shows the exact thing being explained — real footage of the subject
    plus clear stat/diagram overlays; ONE AI cinematic still for the concept that
    can't be filmed. Accurate, attributed, no vague 'science stock' filler.
  music_mood: bright-curious
