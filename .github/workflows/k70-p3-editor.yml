name: K70 P3 Intelligent Editor

on:
  push:
    branches: [main]
    paths:
      - "tools/k70_scene_engine/intelligent_editor.py"
      - "scripts/k70_p3_editor.py"
      - "tests/test_k70_p3_intelligent_editor.py"
      - ".github/workflows/k70-p3-editor.yml"
  pull_request:
    paths:
      - "tools/k70_scene_engine/intelligent_editor.py"
      - "scripts/k70_p3_editor.py"
      - "tests/test_k70_p3_intelligent_editor.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone test runner
        run: python -m pip install pytest
      - name: Run P3 semantic editor tests (no model calls)
        run: python -m pytest -q tests/test_k70_p3_intelligent_editor.py
